<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="260" height="70">
  <!-- Hexagonal brand mark, 60x60 centered in a 70px tall slot -->
  <g transform="translate(5,5) scale(0.3)">
    <defs>
      <clipPath id="pub-cp">
        <polygon points="100,14 175,57 175,143 100,186 25,143 25,57"/>
      </clipPath>
      <linearGradient id="pub-lg" x1="10%" y1="0%" x2="90%" y2="100%">
        <stop offset="0%" stop-color="#d0c6f8"/>
        <stop offset="48%" stop-color="#9184d9"/>
        <stop offset="100%" stop-color="#4a3b96"/>
      </linearGradient>
      <linearGradient id="pub-sm" gradientUnits="userSpaceOnUse" x1="100" y1="68" x2="100" y2="132">
        <stop offset="0%" stop-color="#f6f4ff"/>
        <stop offset="100%" stop-color="#c4b8f0"/>
      </linearGradient>
      <radialGradient id="pub-rg" cx="38%" cy="28%" r="65%">
        <stop offset="0%" stop-color="#30345a"/>
        <stop offset="28%" stop-color="#1e2240"/>
        <stop offset="60%" stop-color="#0f1228"/>
        <stop offset="100%" stop-color="#07080f"/>
      </radialGradient>
      <linearGradient id="pub-sh" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.09"/>
      </linearGradient>
      <filter id="pub-gf">
        <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <polygon points="100,14 175,57 175,143 100,186 25,143 25,57" fill="url(#pub-rg)"/>
    <polygon points="100,14 175,57 175,143 100,186 25,143 25,57" fill="url(#pub-sh)"/>
    <g clip-path="url(#pub-cp)">
      <polyline points="40,132 40,68 100,108 160,68 160,132" fill="none" stroke="url(#pub-sm)" stroke-width="12" stroke-linejoin="miter" stroke-linecap="square" stroke-miterlimit="2" filter="url(#pub-gf)"/>
      <line x1="33" y1="62" x2="47" y2="76" stroke="#b8aaee" stroke-width="1.9" opacity="0.9"/>
      <line x1="153" y1="62" x2="167" y2="76" stroke="#b8aaee" stroke-width="1.9" opacity="0.9"/>
      <line x1="33" y1="126" x2="47" y2="140" stroke="#b8aaee" stroke-width="1.9" opacity="0.9"/>
      <line x1="153" y1="126" x2="167" y2="140" stroke="#b8aaee" stroke-width="1.9" opacity="0.9"/>
    </g>
    <polygon points="100,14 175,57 175,143 100,186 25,143 25,57" fill="none" stroke="url(#pub-lg)" stroke-width="2.2"/>
    <circle cx="100" cy="14" r="3" fill="#9184d9"/>
    <circle cx="175" cy="57" r="3" fill="#9184d9"/>
    <circle cx="25" cy="57" r="3" fill="#9184d9"/>
  </g>
  <!-- Divider -->
  <line x1="73" y1="14" x2="73" y2="56" stroke="#595d6c" stroke-width="1"/>
  <!-- MAXINA -->
  <text x="83" y="36" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="#e9e9ed" letter-spacing="-0.3">MAXINA</text>
  <!-- DIGITAL -->
  <text x="84" y="52" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#b2b6ca" letter-spacing="4">DIGITAL</text>
</svg>
