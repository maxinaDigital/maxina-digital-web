<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Hexágono blanco para fondos oscuros -->
  <polygon points="40,10 68,10 82,34 68,58 40,58 26,34" fill="white"/>

  <!-- M azul -->
  <text x="54" y="34"
    font-family="Outfit, Arial, sans-serif"
    font-size="30"
    font-weight="700"
    fill="#1a3a6b"
    text-anchor="middle"
    dominant-baseline="central">M</text>

  <!-- Línea separadora -->
  <line x1="96" y1="16" x2="96" y2="52" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- MAXINA blanco -->
  <text x="108" y="30"
    font-family="Outfit, Arial, sans-serif"
    font-size="22"
    font-weight="700"
    fill="white"
    letter-spacing="-0.5">MAXINA</text>

  <!-- DIGITAL blanco suave -->
  <text x="109" y="50"
    font-family="Outfit, Arial, sans-serif"
    font-size="10"
    font-weight="300"
    fill="rgba(255,255,255,0.55)"
    letter-spacing="5">DIGITAL</text>
</svg>
